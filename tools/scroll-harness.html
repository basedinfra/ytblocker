<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YTBlocker Scroll Harness</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 24px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    ytd-rich-item-renderer {
      display: block;
      margin: 24px auto;
      max-width: 760px;
      min-height: 180px;
      padding: 18px;
      background: #fff;
      border: 1px solid #ddd;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    ytd-brand-video-shelf-renderer,
    video-display-button-group-layout-view-model {
      display: block;
      margin: 24px auto;
      max-width: 760px;
      min-height: 220px;
      padding: 18px;
      background: #fff;
      border: 1px solid #ddd;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    #video-title {
      display: block;
      margin-bottom: 12px;
      color: #111;
      font-size: 20px;
      font-weight: 700;
    }

    #metadata-line {
      color: #666;
      font-size: 13px;
    }

    ytd-thumbnail-overlay-time-status-renderer {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 6px;
      color: #fff;
      background: #111;
      border-radius: 3px;
    }

    button[aria-label="More actions"] {
      float: right;
      width: 36px;
      height: 36px;
    }

    ytd-menu-service-item-renderer {
      display: block;
      position: fixed;
      top: 80px;
      left: 80px;
      z-index: 20;
      padding: 12px 18px;
      background: #fff;
      border: 1px solid #bbb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <header>
    <strong>YTBlocker Scroll Harness</strong>
    <span id="status">ready</span>
  </header>
  <main id="contents"></main>

  <script>
    const nativeScrollTo = window.scrollTo.bind(window);
    const nativeScrollBy = window.scrollBy.bind(window);
    const nativeScrollIntoView = Element.prototype.scrollIntoView;
    const logs = [];
    const originalLog = console.log.bind(console);

    console.log = (...args) => {
      logs.push(args.map((arg) => String(arg)).join(" "));
      originalLog(...args);
    };

    function attachNotInterestedMenu(card, button) {
      button.addEventListener("click", () => {
        window.__harnessMenuClicks += 1;
        // Simulate YouTube page-world behavior that a content-script prototype
        // patch cannot intercept: jump to the real card location.
        nativeScrollTo(0, card.offsetTop);

        document.querySelectorAll("ytd-menu-popup-renderer").forEach((el) => {
          el.remove();
        });
        const menu = document.createElement("ytd-menu-popup-renderer");
        menu.setAttribute("role", "menu");
        const item = document.createElement("ytd-menu-service-item-renderer");
        item.setAttribute("role", "menuitem");
        item.textContent = "Not interested";
        item.addEventListener("click", () => {
          window.__harnessNotInterestedClicks += 1;
          nativeScrollTo(0, card.offsetTop);
          menu.remove();
        });
        menu.appendChild(item);
        document.body.appendChild(menu);
      });
    }

    function appendVideo(index, title, duration, ageText) {
      const card = document.createElement("ytd-rich-item-renderer");
      card.innerHTML = `
        <button type="button" aria-label="More actions">...</button>
        <a id="video-title" title="${title}">${title}</a>
        <div id="metadata-line"><span>${ageText}</span><span>1K views</span></div>
        <ytd-thumbnail-overlay-time-status-renderer>
          <span id="text">${duration}</span>
        </ytd-thumbnail-overlay-time-status-renderer>
      `;

      attachNotInterestedMenu(card, card.querySelector("button"));

      document.getElementById("contents").appendChild(card);
    }

    function appendPremiumShelf() {
      const title = "Listen in the background with YouTube Premium";
      const shelf = document.createElement("ytd-brand-video-shelf-renderer");
      shelf.innerHTML = `
        <div id="content-wrapper">
          <div id="shelf-header-container">
            <div id="section-header-container">
              <h2>${title}</h2>
              <div class="ytBadgeShapeText">YouTube featured</div>
            </div>
            <div id="subtitle-container">
              <yt-formatted-string id="subtitle">Listen to podcasts in the background, screen off.</yt-formatted-string>
            </div>
            <div id="top-buttons-container">
              <a href="/premium?ybp=test" aria-label="Try 1 month for $0">Try 1 month for $0</a>
              <ytd-menu-renderer>
                <button type="button" aria-label="${title} - More actions">...</button>
              </ytd-menu-renderer>
            </div>
          </div>
        </div>
      `;

      attachNotInterestedMenu(shelf, shelf.querySelector("button"));
      document.getElementById("contents").appendChild(shelf);
    }

    function appendSponsoredVideo() {
      const ad = document.createElement("video-display-button-group-layout-view-model");
      ad.innerHTML = `
        <div>
          <yt-lockup-view-model>
            <div class="ytLockupViewModelHost content-id-8_kmWOsxcXs">
              <a id="video-title" class="ytLockupViewModelContentImage" href="https://www.googleadservices.com/pagead/aclk?video_id=8_kmWOsxcXs" rel="nofollow">
                They don't care if you can't afford a ransom.
              </a>
              <div class="ytLockupViewModelMetadata">
                <feed-ad-metadata-view-model>
                  <ad-badge-view-model>
                    <badge-shape class="ytBadgeShapeHost ytBadgeShapeAd">
                      <div class="ytBadgeShapeText">Sponsored</div>
                    </badge-shape>
                  </ad-badge-view-model>
                  <ad-details-line-view-model>Huntress</ad-details-line-view-model>
                </feed-ad-metadata-view-model>
                <ad-button-group-view-model>
                  <a href="/watch?v=8_kmWOsxcXs">Watch</a>
                  <a href="https://www.googleadservices.com/pagead/aclk?video_id=8_kmWOsxcXs" rel="nofollow">Learn more</a>
                </ad-button-group-view-model>
              </div>
            </div>
          </yt-lockup-view-model>
        </div>
      `;

      document.getElementById("contents").appendChild(ad);
    }

    function createModernLockupVideo({ title, videoId, channelName, channelHref }) {
      const card = document.createElement("div");
      card.className = `ytLockupViewModelHost ytLockupViewModelVertical content-id-${videoId}`;
      card.style.minHeight = "180px";
      card.style.display = "block";
      card.innerHTML = `
        <a href="/watch?v=${videoId}" class="ytLockupViewModelContentImage"></a>
        <div class="ytLockupViewModelMetadata">
          <yt-lockup-metadata-view-model class="ytLockupMetadataViewModelHost">
            <div class="ytLockupMetadataViewModelTextContainer">
              <h3 class="ytLockupMetadataViewModelHeadingReset" title="${title}">
                <a href="/watch?v=${videoId}" class="ytLockupMetadataViewModelTitle" aria-label="${title} 27 minutes">
                  <span class="ytAttributedStringHost ytAttributedStringWhiteSpacePreWrap">${title}</span>
                </a>
              </h3>
              <div class="ytLockupMetadataViewModelMetadata">
                <yt-content-metadata-view-model class="ytContentMetadataViewModelHost">
                  <div role="group" class="ytContentMetadataViewModelMetadataRow">
                    <span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText">
                      <span><a class="ytAttributedStringLink ytAttributedStringLinkCallToActionColor ytAttributedStringLinkInheritColor" href="${channelHref}">${channelName}</a></span>
                    </span>
                  </div>
                  <div role="group" class="ytContentMetadataViewModelMetadataRow">
                    <span>23K views</span><span>1 day ago</span>
                  </div>
                </yt-content-metadata-view-model>
              </div>
            </div>
            <div class="ytLockupMetadataViewModelMenuButton">
              <button type="button" aria-label="More actions">...</button>
            </div>
          </yt-lockup-metadata-view-model>
        </div>
      `;

      attachNotInterestedMenu(card, card.querySelector("button"));
      return card;
    }

    function appendModernLockupVideo() {
      document.getElementById("contents").appendChild(createModernLockupVideo({
        title: "AI Bubble Will Burst Eventually Says Bridgewater's Ray Dalio",
        videoId: "WZ7mmTrSgxI",
        channelName: "Bloomberg Podcasts",
        channelHref: "/@BloombergPodcasts",
      }));
    }

    function prependPbsNorthLockupVideo() {
      const contents = document.getElementById("contents");
      contents.prepend(createModernLockupVideo({
        title: "The Trillion-Dollar Gas Hunt: Minnesota’s Massive Helium Discovery | In Business",
        videoId: "NoxHubOdxIk",
        channelName: "PBS North",
        channelHref: "/@PBSNorth",
      }));
      nativeScrollTo(0, 0);
    }

    function resetFeed() {
      document.getElementById("contents").textContent = "";
      document.querySelectorAll("ytd-menu-popup-renderer").forEach((el) => {
        el.remove();
      });
      window.__harnessMenuClicks = 0;
      window.__harnessNotInterestedClicks = 0;

      for (let i = 1; i <= 34; i += 1) {
        appendVideo(i, `Regular video ${i}`, "10:00", "2 days ago");
      }
      appendVideo(35, "BLOCKME offscreen keyword target", "2:30:00", "5 years ago");
      for (let i = 36; i <= 48; i += 1) {
        appendVideo(i, `Regular video ${i}`, "10:00", "2 days ago");
      }

      nativeScrollTo(0, 360);
    }

    window.__ytbHarness = {
      logs,
      nativeScrollTo,
      nativeScrollBy,
      nativeScrollIntoView,
      resetFeed,
      appendVideo,
      appendPremiumShelf,
      appendSponsoredVideo,
      appendModernLockupVideo,
      prependPbsNorthLockupVideo,
      setChromeSettings(settings) {
        window.chrome = {
          storage: {
            sync: {
              get(defaults, callback) {
                callback({ ...defaults, ...settings });
              },
              set() {},
            },
            onChanged: {
              addListener() {},
            },
          },
        };
      },
      snapshot() {
        return {
          scrollY: window.scrollY,
          menuClicks: window.__harnessMenuClicks,
          notInterestedClicks: window.__harnessNotInterestedClicks,
          cardCount: document.querySelectorAll("ytd-rich-item-renderer").length,
          premiumShelfCount: document.querySelectorAll("ytd-brand-video-shelf-renderer").length,
          logs,
        };
      },
    };

    resetFeed();
  </script>
</body>
</html>
